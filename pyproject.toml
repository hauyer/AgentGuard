[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "1.1.0rc5"
description = "Contract-first multi-agent causal security investigation and targeted defense framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentGuard contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.111,<1",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "hatchling>=1.24,<2", "pytest>=8.0,<10", "httpx>=0.27,<0.29", "ruff==0.17.2"]
whitebox = ["torch>=2.2,<3", "transformers>=4.40,<5"]
fractal = []
stegopot = []
mcp = ["mcp>=1.2,<2"]

[project.scripts]
agentguard = "agentguard.cli:main"
agentguard-mcp = "agentguard.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
